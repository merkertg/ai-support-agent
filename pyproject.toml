# Основные сведения о проекте и библиотеки, необходимые для запуска API.
[project]
name = "ai-support-agent"
version = "0.1.0"
description = "AI-powered technical support system: agent with tools, document search, human review workflow and CI/CD"
readme = "README.md"
# Ограничение проверяется при выборе Python для окружения проекта.
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2,<3",  # Проверка адреса клиента через Pydantic EmailStr.
    "fastapi",             # Маршруты API, JSON-ответы и документация /docs.
    "langgraph>=1.2.12,<1.3",  # Граф процесса: анализ → решение человека → доставка.
    # Checkpointer хранит состояние графа в PostgreSQL между HTTP-запросами.
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "openai>=3.24.0,<4",  # Официальный SDK: Responses API и Structured Outputs.
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "qdrant-client>=1.19.1,<2",  # Официальный клиент векторной БД для поиска документов.
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]",   # ASGI-сервер и дополнения, включая автоперезапуск.
]

# Инструменты разработки: uv sync устанавливает группу dev по умолчанию.
[dependency-groups]
# Панель оператора и её HTTP-клиент; включаются через --group ui.
ui = ["streamlit==1.66.1", "httpx"]
dev = [
    {include-group = "ui"},  # Обычный uv sync готовит также тесты интерфейса.
    "httpx",   # HTTP-клиент, который также использует наш TestClient.
    "pytest-cov>=7.1,<8",  # Покрытие строк и ветвей полного набора тестов.
    "pytest",  # Находит и запускает автоматические тесты.
    "ruff",    # Проверяет код и его форматирование.
]

# Политика зависимостей: в lock попадают выпуски старше двух недель,
# кроме явно обоснованных точных security-версий ниже.
# uv не видит файлы PyPI новее этой даты. При обновлении зависимостей сдвинь
# дату не ближе чем на 14 дней к текущему дню; CI проверяет это отдельно
# скриптом scripts/check_dependency_age.py по датам публикации в uv.lock.
[tool.uv]
exclude-newer = "2026-10-12T00:00:00Z"
# Исправления опубликованы после общей границы; каждый допуск ограничен датой.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", pillow = "2026-10-17T00:00:00Z", streamlit = "2026-10-22T00:00:00Z" }
# Не позволять последующему разрешению вернуть известные уязвимые версии.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "opentelemetry-api>=1.45.1",
    "pillow>=13.0.0",
]

# check_dependency_age.py допускает только названную точную версию,
# сохраняя проверку дат и минимальный возраст всех остальных пакетов.
[tool.dependency-age.security-exceptions.certifi]
version = "2026.10.19"
reason = "Удаление скомпрометированного корня emSign; исправление PYSEC-2026-4320."
advisory = "https://github.com/certifi/python-certifi/security/advisories/GHSA-6q48-6c7w-9gw2"

[tool.dependency-age.security-exceptions.pillow]
version = "13.0.0"
reason = "Исправление 35 находок pip-audit в Pillow 12.3.0."
advisory = "https://github.com/python-pillow/Pillow/releases/tag/13.0.0"

[tool.dependency-age.security-exceptions.streamlit]
version = "1.66.1"
reason = "Первый стабильный выпуск с поддержкой Pillow 13: прежние требуют pillow<13."
advisory = "https://pypi.org/pypi/streamlit/1.66.1/json"

# Pytest ищет тесты в tests/ и добавляет корень проекта в путь импортов.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Неизвестный marker считается ошибкой, а не тихо пропущенной проверкой.
addopts = "--strict-markers"
markers = [
    "integration: tests requiring isolated PostgreSQL and Qdrant via TEST_DATABASE_URL and TEST_QDRANT_URL",
]
# Unit-тесты используют Qdrant в памяти процесса: индексы payload там не нужны.
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

# Ruff проверяет код с учётом синтаксиса Python 3.12.
[tool.ruff]
target-version = "py312"
line-length = 88

# E — стиль, F — ошибки кода, I — порядок импортов, UP — современный Python.
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Измеряем исполняемую логику приложения, UI, оценок и CLI; макет PDF проверяется
# рендером, поэтому визуальный генератор не включён в числовой порог тестов.
[tool.coverage.run]
# Smoke CLI запускается дочерним Python: его покрытие объединяется с Pytest.
patch = ["subprocess"]
branch = true
source = ["app", "operator_ui", "evaluations", "scripts"]
# Шаблон с «*/» не зависит от рабочей папки: дочерний Python, запущенный тестом
# во временном каталоге, иначе отметил бы генератор PDF как непокрытый файл.
omit = ["*/scripts/build_guide.py", "scripts/build_guide.py"]
relative_files = true

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"

[tool.coverage.html]
directory = "reports/coverage-html"
