# Локальный стенд этапов 02–07. Настройки берутся из .env, образ — из Dockerfile.
name: ai-support-agent

# Миграции и API запускаются из одного образа с одинаковым DATABASE_URL.
x-application: &application
  image: ${APP_IMAGE:-ai-support-agent:local}
  build:
    context: .
  environment: &database-environment
    DATABASE_URL: ${DATABASE_URL_DOCKER:?Скопируй .env.example в .env и укажи DATABASE_URL_DOCKER}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажи POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_support}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Обычный down не удаляет этот том: записи переживают пересоздание БД.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # TCP проверяется после инициализации, отдельно от временного init-сервера.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Векторная БД этапа 06: фрагменты статей базы знаний и их эмбеддинги.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      # Учебный стенд не отправляет анонимную телеметрию Qdrant.
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6335}:6333"
    volumes:
      # Как и PostgreSQL, индекс переживает обычный down без --volumes.
      - qdrant_data:/qdrant/storage
    healthcheck:
      # В образе нет curl: bash отправляет HTTP-запрос к /readyz через /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    <<: *application
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # Короткая команда миграции не является HTTP-сервером.
    healthcheck:
      disable: true

  api:
    <<: *application
    # Миграции получают только DATABASE_URL; ключ модели нужен лишь API.
    environment:
      <<: *database-environment
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      QDRANT_URL: ${QDRANT_URL_DOCKER:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-support_knowledge}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.2}
      # LangGraph не отправляет трассы во внешний LangSmith.
      LANGSMITH_TRACING: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # /ready проверяет только PostgreSQL; Qdrant нужен поиску и агенту.
      qdrant:
        condition: service_healthy
    # В Dockerfile /ready проверяет соединение с БД и актуальность миграции.
    healthcheck:
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Отдельная одноразовая БД для integration tests. Данные development не затрагиваются.
  db-test:
    profiles: [test]
    image: postgres:17
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_ci
      POSTGRES_DB: ai_support_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    # Тестовые записи хранятся в памяти и не переживают остановку контейнера.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U support -d ai_support_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Отдельный одноразовый Qdrant для integration tests; индекс хранится в памяти.
  qdrant-test:
    profiles: [test]
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_TEST_PORT:-6336}:6333"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
  qdrant_data:
