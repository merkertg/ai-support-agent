# Проверяем каждое изменение и доставляем проверенный образ из main в GHCR.
name: CI and GHCR

# Локальный git commit не запускает CI: нужен push коммита на GitHub.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Запись в Packages разрешена ниже только заданию publish.
permissions:
  contents: read

# Новая версия PR отменяет старую проверку этого PR. Каждый main push
# получает уникальный group и проходит проверки без отмены другими push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Этап 1. Зафиксированные зависимости, стиль кода и полный набор тестов.
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      # --locked завершает проверку ошибкой при расхождении pyproject и lock.
      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked

      # Проверки независимы: ошибка lint не мешает увидеть результат тестов.
      # Общий результат job остаётся ошибкой, если упала любая проверка.
      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff check .

      - name: Ruff format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff format --check .

      - name: Run all tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked pytest -v --junitxml=reports/pytest.xml

      # XML-отчёт доступен в Actions и при падении теста.
      - name: Upload test report
        if: ${{ !cancelled() && hashFiles('reports/pytest.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 7

  # Этап 2. Проверяем реальный запуск образа только после успеха Python CI.
  container:
    name: Build and smoke test Docker
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ai-support-agent:ci .

      # Порт открыт только на runner; после проверки контейнер удаляется.
      - name: Start container
        run: |
          docker run --detach --name ai-support-agent-ci \
            --publish 127.0.0.1:8000:8000 ai-support-agent:ci

      - name: Check HTTP endpoints
        run: |
          python3 scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 --timeout 30

      # Передаём publish именно уже проверенный образ. Повторной сборки нет.
      - name: Export tested image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p image-artifact
          docker image inspect --format '{{.Id}}' ai-support-agent:ci \
            > image-artifact/tested-image-id.txt
          docker save --output image-artifact/ai-support-agent.tar ai-support-agent:ci

      - name: Upload tested image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-docker-image
          path: image-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Show container logs on failure
        if: failure()
        run: docker logs ai-support-agent-ci || true

      # always() обеспечивает уборку при успехе, ошибке или отмене workflow.
      - name: Remove test container
        if: always()
        run: docker rm --force ai-support-agent-ci || true

  # Этап 3. GHCR только после успеха CI и только push в main.
  # Ручной запуск и pull request проверяют проект без публикации.
  publish:
    name: Publish tested image to GHCR
    needs: container
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Публикации идут по очереди: старый run не перезапишет latest после
    # нового. queue:max сохраняет до 100 ожидающих job вместо их отмены.
    concurrency:
      group: ghcr-main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-docker-image
          path: image-artifact

      - name: Load and verify tested image
        run: |
          docker load --input image-artifact/ai-support-agent.tar
          expected_id="$(cat image-artifact/tested-image-id.txt)"
          actual_id="$(docker image inspect --format '{{.Id}}' ai-support-agent:ci)"
          test "$actual_id" = "$expected_id"

      # GHCR требует нижний регистр; имя берём из текущего репозитория.
      - name: Prepare image names
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"
          printf 'IMAGE_SHA_TAG=sha-%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"

      # Временный GITHUB_TOKEN выдаётся автоматически; PAT не требуется.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify SHA tag
        run: |
          docker tag ai-support-agent:ci "$IMAGE_NAME:$IMAGE_SHA_TAG"
          docker push "$IMAGE_NAME:$IMAGE_SHA_TAG"
          docker manifest inspect "$IMAGE_NAME:$IMAGE_SHA_TAG" > sha-manifest.json
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$IMAGE_SHA_TAG")"
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_ENV"

      # Job может попасть в очередь позже нового коммита из-за долгих тестов.
      # SHA публикуется всегда, latest — только для текущей вершины main.
      - name: Publish latest for current main commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > main-ref.json
          main_sha="$(python3 -c "import json; print(json.load(open('main-ref.json'))['object']['sha'])")"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            docker tag ai-support-agent:ci "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
            docker manifest inspect "$IMAGE_NAME:latest" > latest-manifest.json
            cmp sha-manifest.json latest-manifest.json
            printf 'LATEST_STATUS=latest опубликован и проверен\n' >> "$GITHUB_ENV"
          else
            printf 'LATEST_STATUS=latest пропущен: в main уже есть более новый коммит\n' >> "$GITHUB_ENV"
          fi

      # SHA-тег и digest позволяют скачать ту же версию после смены latest.
      - name: Write publication summary
        run: |
          {
            printf '## Docker-образ опубликован\n\n'
            printf -- '- Образ: `%s:%s`\n' "$IMAGE_NAME" "$IMAGE_SHA_TAG"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- %s\n' "$LATEST_STATUS"
            printf -- '- [Packages репозитория](%s/%s/packages)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
            printf 'Скачать проверенную версию:\n\n```bash\ndocker pull %s\n```\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
