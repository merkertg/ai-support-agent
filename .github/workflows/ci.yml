# Проверяем изменения и доставляем проверенные API/UI образы main и релизов в GHCR.
name: CI and GHCR

# Локальный git commit не запускает CI: нужен push коммита на GitHub.
on:
  push:
    branches: [main]
    # Только явный push тега. Его точный формат и история проверяются до CI.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Запись в Packages разрешена ниже только заданию publish.
permissions:
  contents: read

# Новая версия PR отменяет старую проверку этого PR. Каждый main push
# получает уникальный group и проходит проверки без отмены другими push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Тег — выбранная человеком версия: не создаём его и не выпускаем GitHub Release.
  # Полная история нужна для annotated tags и проверки принадлежности истории main.
  delivery:
    name: Validate delivery target
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact commit and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main ancestry
        run: python3 scripts/release_delivery.py validate

  # Этап 1. Зафиксированные зависимости, стиль кода и полный набор тестов.
  checks:
    name: Python checks
    needs: delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Это отдельная БД runner: интеграционные тесты вправе сбрасывать её схему.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support_ci
          POSTGRES_DB: ai_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U support -d ai_support_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Отдельный Qdrant runner: тесты создают и удаляют только коллекции test_*.
      # Готовность проверяет шаг ниже: в образе Qdrant нет curl для health-cmd.
      qdrant:
        image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+psycopg://support:support_ci@127.0.0.1:5432/ai_support_test
      TEST_DATABASE_URL: postgresql+psycopg://support:support_ci@127.0.0.1:5432/ai_support_test
      TEST_QDRANT_URL: http://127.0.0.1:6333
      # CI никогда не выполняет платные запросы к модели и эмбеддингам.
      LLM_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      EMBEDDING_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      # --locked завершает проверку ошибкой при расхождении pyproject и lock.
      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked

      # Политика зависимостей: в uv.lock только выпуски PyPI старше двух недель.
      # Даты публикации берутся из самого lock-файла, сеть не нужна.
      - name: Check dependency release age
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python scripts/check_dependency_age.py --min-age-days 14

      # Проверяем сам workflow зафиксированным бинарным выпуском с SHA256.
      # Исключение относится только к новому queue: max, которого ещё нет в 1.7.12.
      - name: Validate GitHub Actions workflow
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          tools_dir="$RUNNER_TEMP/actionlint"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tools_dir" actionlint
          "$tools_dir/actionlint" -shellcheck= -pyflakes= \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml

      # Docstrings, локальные ссылки и примеры проверяются на каждом push/PR.
      # pwsh на runner Ubuntu разбирает PowerShell-примеры инструкций без выполнения.
      - name: Check documentation and project contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python scripts/check_project.py --require-powershell

      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:6333/readyz; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant не стал готов за 60 секунд" >&2
          exit 1

      # Проверяем реальный путь создания БД и совпадение схемы с моделями.
      # Ошибка миграции блокирует container и дальнейшую публикацию образа.
      - name: Apply database migrations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked alembic upgrade head

      - name: Check database schema drift
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked alembic check

      # Проверки независимы: ошибка lint не мешает увидеть результат тестов.
      # Общий результат job остаётся ошибкой, если упала любая проверка.
      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff check .

      - name: Ruff format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff format --check .

      - name: Run all tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          uv run --locked pytest -v --junitxml=reports/pytest.xml \
            --cov --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=json --cov-report=html

      # Этап 09: поиск и контракт агента без сети, ключей и PostgreSQL.
      # Порог из evaluations/thresholds.json нарушен → код 1 и красный job.
      - name: Run offline evaluations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python -m evaluations.run --output reports/evaluations.json

      # XML-отчёт доступен в Actions и при падении теста.
      - name: Upload test report
        if: ${{ !cancelled() && hashFiles('reports/pytest.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 7

      # JSON сохраняет каждый вопрос и промах, включая провал порога.
      - name: Upload evaluation report
        if: ${{ !cancelled() && hashFiles('reports/evaluations.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-report
          path: reports/evaluations.json
          if-no-files-found: error
          retention-days: 7

      # Сохраняем покрытие также при нарушенном пороге или упавшем тесте.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('reports/coverage.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            reports/coverage.xml
            reports/coverage.json
            reports/coverage-html/
          if-no-files-found: error
          retention-days: 7

  # Независимая проверка известных уязвимостей зависимостей обоих образов.
  # Проверяем точные версии из lock; зависимые задания блокируются при ошибке сети.
  security:
    name: Audit runtime dependencies
    needs: delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      # Экспорт сохраняет hashes: аудит не выбирает новые версии пакетов.
      # Группа ui добавляет Streamlit и его зависимости из образа интерфейса.
      - name: Export locked runtime requirements
        run: |
          mkdir -p reports
          uv export --locked --no-dev --group ui --no-emit-project --format requirements.txt \
            --output-file reports/runtime-requirements.txt > /dev/null

      # Инструмент установлен отдельно; проверяемые зависимости не устанавливаются.
      # Без --fix, --ignore-vuln или continue-on-error: находка блокирует delivery.
      - name: Audit all locked runtime dependencies
        run: |
          uv tool run --python 3.12 --from pip-audit==2.10.1 pip-audit \
            --strict --require-hashes --disable-pip --progress-spinner off \
            -r reports/runtime-requirements.txt \
            --format json --output reports/pip-audit.json

      # Сохраняем исходный список и отчёт также при найденной уязвимости.
      # При сетевой ошибке JSON может отсутствовать; сам audit остаётся failed.
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  # Переносимость: Python-часть проекта на Linux, macOS (arm64) и Windows.
  # Те же uv 0.12.23, Python 3.12 и uv.lock, что и в checks. Интеграционные тесты
  # с PostgreSQL/Qdrant и Docker-образы проверяются на Linux: у macOS-runner нет
  # Docker, а Windows-runner запускает только Windows-контейнеры.
  portability:
    name: Python on ${{ matrix.os }}
    needs: delivery
    strategy:
      # Ошибка одной ОС не скрывает результат двух других.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      EMBEDDING_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked

      - name: Check dependency release age
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python scripts/check_dependency_age.py --min-age-days 14

      # На Windows bash — это Git Bash из PATH; окончания строк LF задаёт .gitattributes.
      - name: Check documentation and project contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python scripts/check_project.py

      - name: Ruff lint and format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked pytest -q -p no:cacheprovider --ignore=tests/integration

      - name: Run offline evaluations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python -m evaluations.run --output reports/evaluations.json

      # Настоящие процессы Uvicorn и Streamlit на этой ОС, без БД, Docker и сети.
      - name: Start API and operator UI locally
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python scripts/check_local_start.py --timeout 180

  # Этап 2. Проверяем образ только после Python CI и аудита зависимостей.
  container:
    name: Build and smoke test Docker
    needs: [checks, security, portability]
    runs-on: ubuntu-24.04
    # Сборка и запуск arm64-образов под эмуляцией QEMU занимают несколько минут.
    timeout-minutes: 30
    # Compose получает явные настройки: файла .env в CI нет.
    # Этот проект и его том изолированы от Python checks и локальной разработки.
    env:
      APP_IMAGE: ai-support-agent:ci
      UI_IMAGE: ai-support-agent-ui:ci
      UI_PORT: "8502"
      LLM_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      EMBEDDING_PROVIDER: mock
      OPENAI_EMBEDDING_MODEL: ""
      POSTGRES_USER: support
      POSTGRES_PASSWORD: container_ci
      POSTGRES_DB: ai_support
      POSTGRES_PORT: "5433"
      API_PORT: "8000"
      DATABASE_URL_DOCKER: postgresql+psycopg://support:container_ci@db:5432/ai_support
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ai-support-agent:ci .
          # Отдельная цель Dockerfile: только Streamlit, httpx и operator_ui.
          docker build --target ui \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ai-support-agent-ui:ci .

      # HTTP smoke не обнаружит случайный возврат USER root или dev-пакетов.
      # Отдельно проверяем контракт финального runtime-образа до запуска Compose.
      - name: Check runtime user and excluded development tools
        run: |
          docker run --rm --entrypoint python ai-support-agent:ci -c '
          import importlib.util
          import os
          import shutil
          assert os.getuid() == 10001 and os.getgid() == 10001
          assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff"))
          assert shutil.which("uv") is None
          print("OK runtime: UID/GID 10001; pytest, Ruff and uv excluded")
          '
          # Образ UI не содержит серверного кода, драйвера БД и SDK модели.
          docker run --rm --entrypoint python ai-support-agent-ui:ci -c '
          import importlib.util
          import os
          import shutil
          assert os.getuid() == 10001 and os.getgid() == 10001
          absent = ("app", "fastapi", "sqlalchemy", "psycopg", "openai", "langgraph",
                    "qdrant_client", "pytest", "ruff")
          assert all(importlib.util.find_spec(name) is None for name in absent)
          assert importlib.util.find_spec("streamlit") is not None
          assert shutil.which("uv") is None
          print("OK ui: UID/GID 10001; only Streamlit client, no server code")
          '

      # Те же Dockerfile и uv.lock для arm64: Mac на Apple Silicon, ARM-ноутбуки
      # и серверы. Сборка и запуск идут под эмуляцией QEMU; образ проверяется
      # на архитектуру, состав и ответ /health. Эти же образы сканируются и
      # публикуются вместе с amd64 под общими тегами.
      - name: Build and start arm64 images under QEMU
        env:
          BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        run: |
          docker run --privileged --rm "$BINFMT_IMAGE" --install arm64
          docker build --platform linux/arm64 --tag ai-support-agent:ci-arm64 .
          docker build --platform linux/arm64 --target ui \
            --tag ai-support-agent-ui:ci-arm64 .
          docker run --rm --platform linux/arm64 --entrypoint python \
            ai-support-agent:ci-arm64 -c '
          import importlib.util, os, platform, shutil
          assert platform.machine() == "aarch64", platform.machine()
          assert os.getuid() == 10001 and shutil.which("uv") is None
          assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff"))
          import app.main
          print("OK arm64 API image:", platform.machine())
          '
          docker run --rm --platform linux/arm64 --entrypoint python \
            ai-support-agent-ui:ci-arm64 -c '
          import importlib.util, platform
          assert platform.machine() == "aarch64", platform.machine()
          assert importlib.util.find_spec("app") is None
          import streamlit
          print("OK arm64 UI image: Streamlit", streamlit.__version__)
          '
          api="$(docker run --detach --platform linux/arm64 -p 127.0.0.1:18000:8000 \
            -e RUN_RECOVERY_ENABLED=false ai-support-agent:ci-arm64)"
          ui="$(docker run --detach --platform linux/arm64 -p 127.0.0.1:18501:8501 \
            -e API_URL=http://127.0.0.1:9 ai-support-agent-ui:ci-arm64)"
          trap 'docker rm --force "$api" "$ui" > /dev/null' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18000/health > arm64-health.json \
              && curl --fail --silent http://127.0.0.1:18501/_stcore/health > /dev/null; then
              python3 -c 'import json; assert json.load(open("arm64-health.json"))["status"] == "ok"'
              echo "OK arm64: API /health и UI /_stcore/health отвечают"
              exit 0
            fi
            sleep 2
          done
          docker logs "$api" 2>&1 | tail -20
          docker logs "$ui" 2>&1 | tail -20
          exit 1

      # Состав каждого из четырёх проверенных образов в CycloneDX тем же Trivy.
      # Для SBOM база уязвимостей не нужна; ImageID в файле совпадает с ID
      # образа, и publish прикладывает SBOM только к тому же образу.
      - name: Generate SBOM for tested images
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          mkdir -p reports/sbom "$RUNNER_TEMP/trivy-cache"
          for image in ai-support-agent:ci ai-support-agent-ui:ci \
            ai-support-agent:ci-arm64 ai-support-agent-ui:ci-arm64; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/cache" \
              -v "$PWD/reports/sbom:/reports" \
              "$TRIVY_IMAGE" --cache-dir /cache image --quiet \
              --format cyclonedx --output "/reports/${image/:/-}.cdx.json" "$image"
          done

      # Известные уязвимости ОС и Python-пакетов во всех четырёх образах. Trivy запускается
      # образом, закреплённым по digest, без trivy-action: в марте 2026 теги
      # trivy-action и образы Trivy 0.69.4–0.69.6 были подменены (CVE-2026-33634).
      # Блокируют HIGH/CRITICAL, для которых уже выпущено исправление; полный
      # список, включая уязвимости без исправления, сохраняется в JSON-отчёте.
      - name: Scan images for known vulnerabilities
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          mkdir -p reports/image-scan "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/cache" \
              -v "$PWD/reports/image-scan:/reports" \
              "$TRIVY_IMAGE" --cache-dir /cache image --quiet --scanners vuln "$@"
          }
          # База уязвимостей скачивается отдельно с повтором: реестр иногда
          # отвечает ограничением или обрывом, и это не должно ронять сборку.
          for attempt in 1 2 3; do
            if scan --download-db-only; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "База уязвимостей Trivy не скачалась за 3 попытки" >&2
              exit 1
            fi
            sleep 20
          done
          status=0
          for image in ai-support-agent:ci ai-support-agent-ui:ci \
            ai-support-agent:ci-arm64 ai-support-agent-ui:ci-arm64; do
            name="${image/:/-}"
            scan --skip-db-update --format json --output "/reports/$name.json" "$image"
            scan --skip-db-update --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image" || status=1
          done
          exit "$status"

      - name: Upload image scan reports
        if: ${{ !cancelled() && hashFiles('reports/image-scan/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: reports/image-scan/
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM
        if: ${{ !cancelled() && hashFiles('reports/sbom/*.cdx.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: reports/sbom/
          if-no-files-found: error
          retention-days: 30

      # Compose ждёт PostgreSQL, применяет миграцию и проверяет /ready API.
      # --no-build гарантирует использование только что собранного образа.
      - name: Start database, migrations and API
        run: |
          docker compose --project-name ai-support-ci up \
            --detach --no-build --wait --wait-timeout 90 api

      # Явная индексация статей из образа: PostgreSQL-реестр и векторы в Qdrant.
      - name: Index knowledge base
        run: |
          docker compose --project-name ai-support-ci exec -T api \
            python -m app.knowledge.ingest | tee ingest.json
          python3 -c 'import json; r = json.load(open("ingest.json")); assert r["documents"] >= 1 and r["indexed"] and not r["removed"]'

      # Каждый маршрут /api/* требует токен сотрудника. Первого администратора
      # создаёт команда в контейнере API; токен живёт сутки, маскируется в журнале
      # Actions и передаётся следующим шагам через API_TOKEN, а не аргументом.
      - name: Issue CI administrator token
        run: |
          token="$(docker compose --project-name ai-support-ci exec -T api \
            python -m app.tokens issue --email ci-admin@example.com \
            --name "CI administrator" --role admin --label ci-smoke --days 1)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "API_TOKEN=$token" >> "$GITHUB_ENV"

      # --check-review включает БД, API, базу знаний, mock-черновик, запуск агента
      # и решение сотрудника: 401 без токена, 403 для роли operator, отзыв токена
      # и автор решения из токена. Журнал нужен следующему шагу: из него ID запуска.
      - name: Check HTTP endpoints, knowledge search, agent run and review
        run: |
          python3 scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 --timeout 30 --check-review | tee smoke.log

      # Ещё один запуск остаётся в ожидании решения: граф LangGraph будет продолжен
      # только после пересоздания контейнеров, из checkpoint в PostgreSQL.
      - name: Leave a review workflow waiting
        run: |
          python3 scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 --timeout 30 --check-agent | tee pending.log

      # Подтверждаем, что данные находятся в постоянном томе PostgreSQL.
      # После пересоздания контейнеров только читаем: seed мог бы скрыть потерю.
      - name: Verify persistence after container recreation
        run: |
          docker compose --project-name ai-support-ci exec -T api \
            python -m app.db.demo seed > before.json
          # Запуск агента тоже должен пережить пересоздание контейнеров.
          run_path="$(grep -o -m 1 '/api/agent-runs/[0-9]*' smoke.log)"
          test -n "$run_path"
          # Токен хранится в PostgreSQL и тоже переживает пересоздание контейнеров.
          auth="Authorization: Bearer $API_TOKEN"
          curl --fail --silent --show-error -H "$auth" \
            "http://127.0.0.1:8000$run_path" > run-before.json
          # Индекс Qdrant хранится в томе и тоже должен пережить пересоздание.
          search='{"query":"Сервер не запускается после обновления","product_code":"techflow-server"}'
          curl --fail --silent --show-error -H "$auth" -H 'Content-Type: application/json' \
            -d "$search" http://127.0.0.1:8000/api/knowledge/search > knowledge-before.json
          # down без --volumes сохраняет named volume, но удаляет контейнеры.
          docker compose --project-name ai-support-ci down
          docker compose --project-name ai-support-ci up \
            --detach --no-build --wait --wait-timeout 90 api
          docker compose --project-name ai-support-ci exec -T api \
            python -m app.db.demo show > after.json
          cmp before.json after.json
          curl --fail --silent --show-error -H "$auth" \
            "http://127.0.0.1:8000$run_path" > run-after.json
          cmp run-before.json run-after.json
          curl --fail --silent --show-error -H "$auth" -H 'Content-Type: application/json' \
            -d "$search" http://127.0.0.1:8000/api/knowledge/search > knowledge-after.json
          cmp knowledge-before.json knowledge-after.json
          # Повторная индексация после пересоздания ничего не переписывает.
          docker compose --project-name ai-support-ci exec -T api \
            python -m app.knowledge.ingest > ingest-again.json
          python3 -c 'import json; r = json.load(open("ingest-again.json")); assert r["indexed"] == [] and r["removed"] == [] and r["unchanged"]'
          # Решение по запуску, начатому до пересоздания: LangGraph продолжает поток,
          # автор решения — сотрудник API_TOKEN.
          pending_run="$(grep -o -m 1 '/api/agent-runs/[0-9]*' pending.log | grep -o '[0-9]*$')"
          test -n "$pending_run"
          python3 scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 --timeout 30 --review-run "$pending_run"

          python3 scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 --timeout 30 --check-review

      # Этапы 08 и 10: UI ждёт healthy API; страница отрисовывается из контейнера
      # настоящим AppTest после ввода токена, демонстрационный сценарий
      # повторяется без изменений. Демо и UI работают от имени сотрудника API_TOKEN.
      - name: Start operator UI and run demo scenario
        run: |
          docker compose --project-name ai-support-ci up \
            --detach --no-build --wait --wait-timeout 90 ui
          curl --fail --silent --show-error "http://127.0.0.1:${UI_PORT}/_stcore/health" && echo
          python3 scripts/demo_scenario.py \
            --url http://127.0.0.1:8000 --timeout 60 --verify-review > demo.json
          python3 -c '
          import json
          r = json.load(open("demo.json"))
          assert (r["suggestion_status"], r["workflow_state"]) == ("pending", "awaiting_review")
          approve, reject = r["review_checks"]["approve"], r["review_checks"]["reject"]
          assert (approve["status"], approve["messages"], approve["workflow_state"]) == ("approved", 1, "delivered")
          assert (reject["status"], reject["messages"], reject["workflow_state"]) == ("rejected", 0, "rejected")
          print("OK demo:", json.dumps(r, sort_keys=True))
          '
          # Повтор только читает: новых тикетов, анализов и решений нет.
          python3 scripts/demo_scenario.py \
            --url http://127.0.0.1:8000 --timeout 60 --verify-review > demo-again.json
          cmp demo.json demo-again.json
          docker compose --project-name ai-support-ci exec -T -e "API_TOKEN=$API_TOKEN" \
            ui python -c '
          import os
          from streamlit.testing.v1 import AppTest
          screen = AppTest.from_file("operator_ui/main.py", default_timeout=30).run()
          assert not screen.exception, screen.exception
          assert not screen.metric, "без токена данные не показываются"
          screen.sidebar.text_input(key="api_token").input(os.environ["API_TOKEN"]).run()
          assert not screen.exception, screen.exception
          assert not screen.error, [item.value for item in screen.error]
          metrics = {item.label: item.value for item in screen.metric}
          assert int(metrics["Всего обращений"]) >= 4, metrics
          print("OK ui page:", metrics)
          '

      # Журнал API — JSON без query string, заголовков и тел запросов. Smoke и демо
      # отправляли ключи лицензий в теле и в фильтре ?license_key=, а токены
      # сотрудников — в Authorization: в логах их быть не должно. Строка запроса
      # называет сотрудника полем user_id.
      - name: Check API logs for request records and leaked secrets
        run: |
          docker compose --project-name ai-support-ci logs --no-color api > api.log
          grep -q '"event": "request"' api.log
          grep -q '"user_id": ' api.log
          grep -q '"event": "auth_failed"' api.log
          if grep -n -e 'SMOKE-' -e 'DEMO-STAGE10' api.log; then
            echo "Ключ лицензии попал в журнал API" >&2
            exit 1
          fi
          # Строку с токеном не печатаем: совпадение само по себе — утечка.
          if grep -q -E 'asa_[A-Za-z0-9_-]{43}' api.log; then
            echo "Токен сотрудника попал в журнал API" >&2
            exit 1
          fi

      # Один архив содержит именно проверенные API/UI для amd64 и arm64 и их ID.
      # Для релизного тега используются те же gates, что и для main.
      - name: Export tested API and UI images
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: python3 scripts/release_delivery.py export

      - name: Upload tested images
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-docker-images
          path: image-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --project-name ai-support-ci logs --no-color || true

      # Удаляются только контейнеры и том изолированного проекта этого runner.
      # always() обеспечивает уборку при успехе, ошибке или отмене workflow.
      - name: Remove test Compose project
        if: always()
        run: |
          docker compose --project-name ai-support-ci down \
            --volumes --remove-orphans

  # Этап 3. Только push main или прошедшего проверку vX.Y.Z, без пересборки.
  # PR, ручные запуски и dependency-dispatch никогда не публикуют образы.
  publish:
    name: Publish tested image to GHCR
    needs: container
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    # Четыре образа (API/UI × amd64/arm64), общие index-теги, подписи и SBOM.
    timeout-minutes: 30
    # id-token: write нужен только cosign keyless: GitHub выдаёт OIDC-токен,
    # Fulcio — короткий сертификат на identity этого workflow. Ключей нет.
    permissions:
      contents: read
      packages: write
      id-token: write
    # Main и релизы используют одну очередь: version preflight обоих пакетов
    # и публикация не пересекаются с другой публикацией этого workflow.
    concurrency:
      group: ghcr-delivery
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout exact delivery code and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-docker-images
          path: image-artifact

      # SBOM тех же четырёх образов; publish сверит в них image ID до записи.
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      # Официальный выпуск cosign, сверенный по SHA256 из workflow, как actionlint.
      # Ставится до публикации: без cosign job останавливается до первой записи.
      - name: Install cosign
        if: ${{ vars.GHCR_PUBLIC_SIGNING == 'true' }}
        run: |
          tools_dir="$RUNNER_TEMP/cosign"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            --output "$tools_dir/cosign"
          printf '%s  %s\n' \
            '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71' \
            "$tools_dir/cosign" | sha256sum --check --strict
          chmod +x "$tools_dir/cosign"
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"

      # GITHUB_TOKEN выдаётся автоматически; PAT не нужен.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Old main job может ждать дольше нового: latest получает только текущая
      # вершина main на момент проверки. Релизные теги latest не меняют.
      - name: Read current main commit for latest policy
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > main-ref.json
          main_sha="$(python3 -c "import json; print(json.load(open('main-ref.json'))['object']['sha'])")"
          printf 'MAIN_SHA=%s\n' "$main_sha" >> "$GITHUB_ENV"

      # Сначала проверяются ID и платформы всех четырёх образов, их SBOM и все
      # теги версии. Совпавший тег повторно не пишется; конфликт останавливает
      # job до записи. Затем imagetools create связывает amd64 и arm64 в общий
      # тег пакета. Digest записываются в published-images.json.
      - name: Verify and publish tested API and UI images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_delivery.py publish

      # Подписывается digest index из отчёта, а не изменяемый тег. SBOM каждой
      # архитектуры прикладывается attestation к manifest из этого index.
      # cosign verify сразу проверяет identity ci.yml, OIDC GitHub и SHA commit.
      # Сертификат и запись попадают в публичный журнал Sigstore (Rekor).
      - name: Sign indexes and attach SBOM attestations
        if: ${{ vars.GHCR_PUBLIC_SIGNING == 'true' }}
        run: python3 scripts/release_delivery.py sign

      # По выбору пользователя раскрытие metadata в Rekor выключено по умолчанию.
      # Включение: Settings → Secrets and variables → Actions → Variables.
      - name: Report deferred public signing
        if: ${{ vars.GHCR_PUBLIC_SIGNING != 'true' }}
        run: |
          printf '%s\n' \
            '### Подпись подготовлена, но выключена' \
            'SBOM проверен и сохранён как артефакт. Публикация образов завершена без публичной записи Sigstore.' \
            'Для включения keyless-подписи и SBOM attestations задай GHCR_PUBLIC_SIGNING=true в Actions Variables.' \
            >> "$GITHUB_STEP_SUMMARY"
